name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # GitHub Actions spins up a brand-new VM every run, so the debug
      # keystore Gradle auto-generates at ~/.android/debug.keystore is
      # different every single build unless we persist it ourselves. A
      # different keystore = a different app signature, and Android
      # refuses to install an APK signed with a different key "on top of"
      # an already-installed one (INSTALL_FAILED_UPDATE_INCOMPATIBLE /
      # "conflicts with an existing package") - forcing an uninstall
      # first. Caching this one file makes every build reuse the exact
      # same signing key, so future APKs install as a normal in-place
      # Update over the previous one.
      - name: Restore persistent debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persistent-debug-keystore-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/browser@^6.0.0 --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create debug keystore if it doesn't exist yet
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Created new persistent debug keystore"
          else
            echo "Reusing cached debug keystore"
          fi

      - name: Bundle Capacitor Bridge
        run: npx esbuild capacitor-src/bridge.js --bundle --outfile=cap-bridge.js --platform=browser

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp cap-bridge.js www/
          cp -r libs www/
          cp -r app-media www/

      - name: Add Android Platform
        run: npx cap add android

      - name: Disable WebView Scrollbar and Lock Text Zoom
        run: |
          python3 - << 'EOF'
          import glob
          path = glob.glob('android/**/MainActivity.java', recursive=True)[0]
          content = open(path).read()

          if 'onCreate' not in content:
              if 'import android.os.Bundle;' not in content:
                  content = content.replace(
                      'import com.getcapacitor.BridgeActivity;',
                      'import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;'
                  )
              insert = '''
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              this.bridge.getWebView().setVerticalScrollBarEnabled(false);
              this.bridge.getWebView().setHorizontalScrollBarEnabled(false);
              this.bridge.getWebView().setOverScrollMode(android.webkit.WebView.OVER_SCROLL_NEVER);
              this.bridge.getWebView().setScrollBarStyle(android.view.View.SCROLLBARS_INSIDE_OVERLAY);
              this.bridge.getWebView().getSettings().setTextZoom(100);
              this.bridge.getWebView().getSettings().setMinimumFontSize(1);
              this.bridge.getWebView().getSettings().setMinimumLogicalFontSize(1);
              this.bridge.getWebView().clearCache(true);
            }
          '''
              idx = content.rfind('}')
              content = content[:idx] + insert + content[idx:]
              open(path, 'w').write(content)
              print("MainActivity.java patched successfully")
          else:
              print("onCreate already exists - manual check needed")
          EOF

      - name: Generate App Icons from resources
        run: npx @capacitor/assets generate --android

      - name: Copy custom notification icon
        run: |
          mkdir -p android/app/src/main/res
          cp -r notification-icons/drawable-mdpi android/app/src/main/res/
          cp -r notification-icons/drawable-hdpi android/app/src/main/res/
          cp -r notification-icons/drawable-xhdpi android/app/src/main/res/
          cp -r notification-icons/drawable-xxhdpi android/app/src/main/res/
          cp -r notification-icons/drawable-xxxhdpi android/app/src/main/res/

      - name: Patch AndroidManifest for notification permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' $MANIFEST

      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 || \
          (echo "First attempt failed, clearing Gradle cache and retrying..." && \
           rm -rf ~/.gradle/caches && \
           ./gradlew assembleDebug --no-daemon --max-workers=1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
